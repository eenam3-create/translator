<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete French to English Translator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .translator-container { background: #ffffff; width: 100%; max-width: 850px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .app-box { display: flex; gap: 20px; flex-direction: column; }
        @media (min-width: 600px) { .app-box { flex-direction: row; } }
        .text-area-wrapper { flex: 1; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; color: #555; }
        textarea { width: 100%; height: 220px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; resize: none; font-size: 16px; outline: none; }
        .controls { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
        .audio-buttons-row { display: flex; gap: 8px; }
        .speed-control { display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 8px 12px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 14px; }
        .speed-control input { flex: 1; cursor: pointer; }
        button { padding: 10px 15px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-audio { background: #e2e8f0; color: #333; flex: 1; text-align: center; display: inline-block; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg { margin-top: 15px; font-size: 14px; text-align: center; min-height: 20px; font-weight: bold; color: #4a5568; }
        
        /* Interactive Embed Box Layout Changes */
        .google-embed-row {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="translator-container">
    <h1>Complete French to English Translator</h1>
    
    <!-- Official Secure System Dropdown Bar Component -->
    <div class="google-embed-row">
        <span>To translate, choose <strong>English</strong> in the menu widget:</span>
        <div id="google_translate_element"></div>
    </div>

    <div class="app-box">
        <div class="text-area-wrapper">
            <label for="french-text">French (Français)</label>
            <textarea id="french-text" placeholder="Entrez le texte en français..."></textarea>
            <div class="controls">
                <div class="audio-buttons-row">
                    <button class="btn-audio" id="btn-speak">▶ Play Pronunciation</button>
                    <button class="btn-audio" id="btn-pause" disabled>⏸ Pause</button>
                    <button class="btn-audio" id="btn-stop" disabled>⏹ Stop</button>
                </div>
                <div class="speed-control">
                    <label for="speed-slider">Speed:</label>
                    <input type="range" id="speed-slider" min="0.5" max="2" value="1" step="0.1">
                    <span id="speed-val">1.0x</span>
                </div>
            </div>
        </div>
    </div>
    <div class="status-msg" id="status-text">Ready</div>
</div>

<script type="text/javascript">
    // Initialization command for the official CDN engine component script 
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'fr', 
            includedLanguages: 'en', 
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
    }

    const frenchText = document.getElementById('french-text');
    const btnSpeak = document.getElementById('btn-speak');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');

    speedSlider.addEventListener('input', () => {
        speedVal.innerText = parseFloat(speedSlider.value).toFixed(1) + 'x';
    });

    /* --- AUDIO AUDIO AUDIO CONTROLS --- */
    btnSpeak.addEventListener('click', () => {
        const text = frenchText.value.trim();
        if (!text) return;
        if ('speechSynthesis' in window) {
            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
                btnSpeak.disabled = true;
                btnPause.disabled = false;
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = parseFloat(speedSlider.value);
            utterance.onend = resetAudio;
            utterance.onerror = resetAudio;
            window.speechSynthesis.speak(utterance);
            btnSpeak.disabled = true;
            btnPause.disabled = false;
            btnStop.disabled = false;
        }
    });

    btnPause.addEventListener('click', () => {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.pause();
            btnSpeak.disabled = false;
            btnPause.disabled = true;
        }
    });

    btnStop.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        resetAudio();
    });

    function resetAudio() {
        btnSpeak.disabled = false;
        btnPause.disabled = true;
        btnStop.disabled = true;
    }
</script>

<!-- Official Verified Google Web Script CDN - Securely translates any content natively inside layout containers -->
<script type="text/javascript" src="https://google.com"></script>

</body>
</html>
