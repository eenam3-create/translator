<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete French to English Translator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .translator-container { background: #ffffff; width: 100%; max-width: 850px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .app-box { display: flex; gap: 20px; flex-direction: column; }
        @media (min-width: 600px) { .app-box { flex-direction: row; } }
        .text-area-wrapper { flex: 1; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; color: #555; }
        textarea { width: 100%; height: 220px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; resize: none; font-size: 16px; outline: none; }
        .controls { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
        .audio-buttons-row { display: flex; gap: 8px; }
        .speed-control { display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 8px 12px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 14px; }
        .speed-control input { flex: 1; cursor: pointer; }
        button { padding: 10px 15px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-translate { background: #007bff; color: #fff; width: 100%; }
        .btn-translate:hover { background: #0056b3; }
        .btn-audio { background: #e2e8f0; color: #333; flex: 1; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg { margin-top: 15px; font-size: 14px; text-align: center; min-height: 20px; font-weight: bold; color: #4a5568; }
    </style>
</head>
<body>

<div class="translator-container">
    <h1>French to English Translator</h1>
    <div class="app-box">
        <div class="text-area-wrapper">
            <label for="french-text">French (Français)</label>
            <textarea id="french-text" placeholder="Type or paste French text here..."></textarea>
            <div class="controls">
                <div class="audio-buttons-row">
                    <button class="btn-audio" id="btn-speak">▶ Play</button>
                    <button class="btn-audio" id="btn-pause" disabled>⏸ Pause</button>
                    <button class="btn-audio" id="btn-stop" disabled>⏹ Stop</button>
                </div>
                <div class="speed-control">
                    <label for="speed-slider">Speed:</label>
                    <input type="range" id="speed-slider" min="0.5" max="2" value="1" step="0.1">
                    <span id="speed-val">1.0x</span>
                </div>
                <button class="btn-translate" id="btn-translate">Translate</button>
            </div>
        </div>
        <div class="text-area-wrapper">
            <label for="english-text">English</label>
            <textarea id="english-text" placeholder="Translation will appear here..." disabled></textarea>
        </div>
    </div>
    <div class="status-msg" id="status-text">Ready</div>
</div>

<script>
    const frenchText = document.getElementById('french-text');
    const englishText = document.getElementById('english-text');
    const btnTranslate = document.getElementById('btn-translate');
    const btnSpeak = document.getElementById('btn-speak');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');
    const statusText = document.getElementById('status-text');

    speedSlider.addEventListener('input', () => {
        speedVal.innerText = parseFloat(speedSlider.value).toFixed(1) + 'x';
    });

    btnTranslate.addEventListener('click', async () => {
        const text = frenchText.value.trim();
        if (!text) { statusText.innerText = "Please enter some text."; return; }
        
        statusText.innerText = "Processing long text translation...";
        statusText.style.color = "#4a5568";
        englishText.value = "";

        // Smart Splitter: Breaks long text blocks by periods, question marks, and newlines
        const sentences = text.split(/(?<=[.!?])\s+|\n+/);
        let finalResults = [];

        try {
            for (let sentence of sentences) {
                sentence = sentence.trim();
                if (!sentence) continue;

                // Send smaller, clean sentence segments to avoid server query truncation blocks
                const response = await fetch(`https://translated.net{encodeURIComponent(sentence)}&langpair=fr|en`);
                const data = await response.json();
                
                if (data && data.responseData && data.responseData.translatedText) {
                    finalResults.push(data.responseData.translatedText);
                } else {
                    finalResults.push(sentence); // Fallback safe save if a sector delays
                }
            }

            englishText.value = finalResults.join(" ");
            statusText.innerText = "Translation Complete!";
            statusText.style.color = "#2f855a";
        } catch (error) {
            console.error(error);
            statusText.innerText = "Network connection blocked. Check your connection.";
            statusText.style.color = "#c53030";
        }
    });

    /* --- AUDIO PLAYER AUDIO CONTROLS --- */
    btnSpeak.addEventListener('click', () => {
        const text = frenchText.value.trim();
        if (!text) return;
        if ('speechSynthesis' in window) {
            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
                btnSpeak.disabled = true;
                btnPause.disabled = false;
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = parseFloat(speedSlider.value);
            utterance.onend = resetAudio;
            utterance.onerror = resetAudio;
            window.speechSynthesis.speak(utterance);
            btnSpeak.disabled = true;
            btnPause.disabled = false;
            btnStop.disabled = false;
        }
    });

    btnPause.addEventListener('click', () => {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.pause();
            btnSpeak.disabled = false;
            btnPause.disabled = true;
        }
    });

    btnStop.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        resetAudio();
    });

    function resetAudio() {
        btnSpeak.disabled = false;
        btnPause.disabled = true;
        btnStop.disabled = true;
    }
</script>
</body>
</html>
